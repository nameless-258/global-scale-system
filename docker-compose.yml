# =============================================================================
#  GLOBAL-SCALE SYSTEM — Plataforma financeira distribuída e resiliente
#  Arranque:   docker compose up -d --build
#  Interface:  https://localhost:8443/ui/     API: https://localhost:8443/docs
#  HDFS UI:    http://localhost:9870
#
#  Segredos: cada serviço monta apenas certs/publico (CA e chaves públicas) e a
#  SUA pasta certs/<serviço> (chaves privadas e palavras-passe). Ver gen-certs.sh.
# =============================================================================
name: global-scale-system

x-api: &api
  build: ./services/core
  restart: unless-stopped            # auto-recuperação após crash do coordenador
  depends_on:
    certs:      { condition: service_completed_successfully }
    db-europa:  { condition: service_healthy }
    db-america: { condition: service_healthy }
    db-africa:  { condition: service_healthy }
    namenode:   { condition: service_started }

x-api-env: &api-env
  PEERS: api-1,api-2
  LEGACY_URL: https://legacy:8443
  DFS_BACKEND: webhdfs
  DFS_URL: http://namenode:9870
  PERMITIR_INJECAO_FALHAS: "true"

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  entrypoint: ["bash", "/db/entrypoint.sh"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d banco"]
    interval: 3s
    timeout: 3s
    retries: 40

x-hadoop: &hadoop
  image: apache/hadoop:3.3.6
  env_file: ./config/hadoop.env
  restart: unless-stopped

services:
  # ---------------------------------------------------------- PKI e segredos
  certs:
    image: alpine:3.20
    command: sh -c "apk add --no-cache openssl bash >/dev/null && bash /scripts/gen-certs.sh /certs"
    volumes:
      - ./certs:/certs
      - ./scripts:/scripts:ro
    networks: [global-net]

  # ------------------------------------------------- Base de Dados Distribuída
  # Fragmento A — Europa (contas EU-*): primário + réplica síncrona
  db-europa:
    <<: *postgres
    hostname: db-europa
    depends_on:
      certs: { condition: service_completed_successfully }
    environment:
      POSTGRES_PASSWORD_FILE: /certs/privado/postgres_password
      POSTGRES_DB: banco
      DB_NODE_NAME: db-europa
      DB_ROLE: primario
      DB_PARCEIRO: db-europa-r
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/db-europa:/certs/privado:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - ./db/00-pg-hba.sh:/docker-entrypoint-initdb.d/00-pg-hba.sh:ro
      - ./db/schema.inc:/docker-entrypoint-initdb.d/schema.inc:ro
      - ./db/init-europa.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/20-segredos.sh:/docker-entrypoint-initdb.d/20-segredos.sh:ro
      - pg-europa:/var/lib/postgresql/data
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.41 }

  db-europa-r:
    <<: *postgres
    hostname: db-europa-r
    depends_on:
      db-europa: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD_FILE: /certs/privado/postgres_password
      DB_NODE_NAME: db-europa-r
      DB_ROLE: replica
      DB_PRIMARIO: db-europa
      DB_APP_NAME: db_europa_r
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/db-europa-r:/certs/privado:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - pg-europa-r:/var/lib/postgresql/data
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.43 }

  # Fragmento B — América (contas AM-*): primário + réplica síncrona
  db-america:
    <<: *postgres
    hostname: db-america
    depends_on:
      certs: { condition: service_completed_successfully }
    environment:
      POSTGRES_PASSWORD_FILE: /certs/privado/postgres_password
      POSTGRES_DB: banco
      DB_NODE_NAME: db-america
      DB_ROLE: primario
      DB_PARCEIRO: db-america-r
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/db-america:/certs/privado:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - ./db/00-pg-hba.sh:/docker-entrypoint-initdb.d/00-pg-hba.sh:ro
      - ./db/schema.inc:/docker-entrypoint-initdb.d/schema.inc:ro
      - ./db/init-america.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/20-segredos.sh:/docker-entrypoint-initdb.d/20-segredos.sh:ro
      - pg-america:/var/lib/postgresql/data
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.42 }

  db-america-r:
    <<: *postgres
    hostname: db-america-r
    depends_on:
      db-america: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD_FILE: /certs/privado/postgres_password
      DB_NODE_NAME: db-america-r
      DB_ROLE: replica
      DB_PRIMARIO: db-america
      DB_APP_NAME: db_america_r
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/db-america-r:/certs/privado:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - pg-america-r:/var/lib/postgresql/data
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.44 }

  # Fragmento C — África (contas AF-*): primário + réplica síncrona
  db-africa:
    <<: *postgres
    hostname: db-africa
    depends_on:
      certs: { condition: service_completed_successfully }
    environment:
      POSTGRES_PASSWORD_FILE: /certs/privado/postgres_password
      POSTGRES_DB: banco
      DB_NODE_NAME: db-africa
      DB_ROLE: primario
      DB_PARCEIRO: db-africa-r
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/db-africa:/certs/privado:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - ./db/00-pg-hba.sh:/docker-entrypoint-initdb.d/00-pg-hba.sh:ro
      - ./db/schema.inc:/docker-entrypoint-initdb.d/schema.inc:ro
      - ./db/init-africa.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./db/20-segredos.sh:/docker-entrypoint-initdb.d/20-segredos.sh:ro
      - pg-africa:/var/lib/postgresql/data
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.47 }

  db-africa-r:
    <<: *postgres
    hostname: db-africa-r
    depends_on:
      db-africa: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD_FILE: /certs/privado/postgres_password
      DB_NODE_NAME: db-africa-r
      DB_ROLE: replica
      DB_PRIMARIO: db-africa
      DB_APP_NAME: db_africa_r
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/db-africa-r:/certs/privado:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - pg-africa-r:/var/lib/postgresql/data
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.48 }

  # Sentinela: gere a replicação síncrona e faz o failover automático
  sentinela:
    build: ./services/core
    hostname: sentinela
    restart: unless-stopped
    command: ["python", "-u", "-m", "app.sentinela"]
    depends_on:
      db-europa:  { condition: service_healthy }
      db-america: { condition: service_healthy }
      db-africa:  { condition: service_healthy }
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/sentinela:/certs/privado:ro
      - fencing:/fence
    networks:
      global-net: { ipv4_address: 172.28.0.45 }

  # ------------------------------------------ Controlo de falhas (demonstração)
  # Usado pela interface web para derrubar/religar nós. Só aceita JWT de admin
  # e uma lista fechada de serviços e ações (ver services/core/app/controlo.py).
  controlo:
    build: ./services/core
    hostname: controlo
    restart: unless-stopped
    command: ["sh", "-c", "uvicorn app.controlo:app --host 0.0.0.0 --port 8443 --ssl-keyfile /certs/privado/tls.key --ssl-certfile /certs/privado/tls.crt"]
    depends_on:
      certs: { condition: service_completed_successfully }
    environment:
      COMPOSE_PROJECT: global-scale-system
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/controlo:/certs/privado:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - coordenador-data:/data          # só para reativar uma API desativada
    networks:
      global-net: { ipv4_address: 172.28.0.46 }

  # ------------------------------------------ Sistema de Ficheiros Distribuído
  namenode:                           # metadados do HDFS
    <<: *hadoop
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop/dfs/name
    ports:
      - "9870:9870"                   # interface web do HDFS
    networks:
      global-net: { ipv4_address: 172.28.0.51 }

  datanode-1:                         # blocos de dados (réplica 1)
    <<: *hadoop
    hostname: datanode-1
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    networks:
      global-net: { ipv4_address: 172.28.0.52 }

  datanode-2:                         # blocos de dados (réplica 2)
    <<: *hadoop
    hostname: datanode-2
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    networks:
      global-net: { ipv4_address: 172.28.0.53 }

  # ----------------------------------------------------------- Aplicação
  auth:                               # nó emissor de tokens JWT
    build: ./services/auth
    hostname: auth
    restart: unless-stopped
    depends_on:
      certs: { condition: service_completed_successfully }
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/auth:/certs/privado:ro          # só este nó tem a chave privada JWT
      - auth-data:/data                         # clientes criados pelo administrador
    networks:
      global-net: { ipv4_address: 172.28.0.11 }

  api-1:                              # réplica 1 do núcleo / coordenador 2PC
    <<: *api
    hostname: api-1
    environment:
      <<: *api-env
      NODE_ID: api-1
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/api-1:/certs/privado:ro
      - coordenador-data:/data        # registo durável (WAL) dos coordenadores (partilhado)
    networks:
      global-net: { ipv4_address: 172.28.0.21 }

  api-2:                              # réplica 2 do núcleo / coordenador 2PC
    <<: *api
    hostname: api-2
    environment:
      <<: *api-env
      NODE_ID: api-2
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/api-2:/certs/privado:ro
      - coordenador-data:/data
    networks:
      global-net: { ipv4_address: 172.28.0.22 }

  legacy:                             # "mainframe" do banco parceiro (Java + XML)
    build: ./services/legacy-java
    hostname: legacy
    restart: unless-stopped
    depends_on:
      certs: { condition: service_completed_successfully }
    volumes:
      - ./certs/publico:/certs/publico:ro
      - ./certs/legacy:/certs/privado:ro
      - legacy-data:/data             # registo persistente das ordens
    networks:
      global-net: { ipv4_address: 172.28.0.31 }

  gateway:                            # ponto de entrada HTTPS + balanceamento
    image: nginx:1.27-alpine
    hostname: gateway
    restart: unless-stopped
    depends_on: [api-1, api-2, auth]
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ui:/usr/share/nginx/ui:ro
      - ./certs/publico:/certs/publico:ro
      - ./certs/gateway:/certs/privado:ro
    networks:
      global-net: { ipv4_address: 172.28.0.10 }

  # ------------------------------------------- Cliente de demonstração (opcional)
  cliente:
    build: ./services/core
    profiles: ["tools"]
    entrypoint: ["python", "/scripts/cliente.py"]
    environment:
      GSS_URL: https://gateway
      GSS_CA: /certs/publico/ca.crt
      GSS_TOKEN_FILE: /token/jwt
    volumes:
      - ./scripts:/scripts:ro
      - ./certs/publico:/certs/publico:ro
      - cliente-token:/token
    networks: [global-net]

networks:
  global-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pg-europa:
  pg-europa-r:
  pg-america:
  pg-america-r:
  pg-africa:
  pg-africa-r:
  coordenador-data:
  legacy-data:
  fencing:
  cliente-token:
  auth-data:
