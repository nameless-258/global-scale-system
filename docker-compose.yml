# =============================================================================
#  GLOBAL-SCALE SYSTEM — Plataforma financeira distribuída e resiliente
#  Arranque:   docker compose up -d --build
#  Gateway:    https://localhost:8443/docs     HDFS UI: http://localhost:9870
# =============================================================================
name: global-scale-system

x-api: &api
  build: ./services/core
  restart: unless-stopped            # auto-recuperação após crash do coordenador
  depends_on:
    certs:      { condition: service_completed_successfully }
    db-europa:  { condition: service_healthy }
    db-america: { condition: service_healthy }
    namenode:   { condition: service_started }
  volumes:
    - ./certs:/certs:ro
    - coordenador-data:/data         # registo durável (WAL) do coordenador 2PC

x-api-env: &api-env
  DB_EUROPA_HOST: db-europa
  DB_AMERICA_HOST: db-america
  DB_PASSWORD: app_s3cret
  LEGACY_URL: https://legacy:8443
  DFS_BACKEND: webhdfs
  DFS_URL: http://namenode:9870
  PERMITIR_INJECAO_FALHAS: "true"

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  entrypoint: ["bash", "/db/entrypoint.sh"]
  depends_on:
    certs: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d banco"]
    interval: 3s
    timeout: 3s
    retries: 20

x-hadoop: &hadoop
  image: apache/hadoop:3.3.6
  env_file: ./config/hadoop.env
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- PKI
  certs:
    image: alpine:3.20
    command: sh -c "apk add --no-cache openssl bash >/dev/null && bash /scripts/gen-certs.sh /certs"
    volumes:
      - ./certs:/certs
      - ./scripts:/scripts:ro
    networks: [global-net]

  # ------------------------------------------------- Base de Dados Distribuída
  db-europa:                          # Nó A — fragmento Europa (contas EU-*)
    <<: *postgres
    hostname: db-europa
    environment:
      POSTGRES_PASSWORD: postgres_admin
      POSTGRES_DB: banco
      DB_NODE_NAME: db-europa
    volumes:
      - ./certs:/certs:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - ./db/00-pg-hba.sh:/docker-entrypoint-initdb.d/00-pg-hba.sh:ro
      - ./db/schema.inc:/docker-entrypoint-initdb.d/schema.inc:ro
      - ./db/init-europa.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pg-europa:/var/lib/postgresql/data
    networks:
      global-net: { ipv4_address: 172.28.0.41 }

  db-america:                         # Nó B — fragmento América (contas AM-*)
    <<: *postgres
    hostname: db-america
    environment:
      POSTGRES_PASSWORD: postgres_admin
      POSTGRES_DB: banco
      DB_NODE_NAME: db-america
    volumes:
      - ./certs:/certs:ro
      - ./db/entrypoint.sh:/db/entrypoint.sh:ro
      - ./db/00-pg-hba.sh:/docker-entrypoint-initdb.d/00-pg-hba.sh:ro
      - ./db/schema.inc:/docker-entrypoint-initdb.d/schema.inc:ro
      - ./db/init-america.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pg-america:/var/lib/postgresql/data
    networks:
      global-net: { ipv4_address: 172.28.0.42 }

  # ------------------------------------------ Sistema de Ficheiros Distribuído
  namenode:                           # metadados do HDFS
    <<: *hadoop
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop/dfs/name
    ports:
      - "9870:9870"                   # interface web do HDFS
    networks:
      global-net: { ipv4_address: 172.28.0.51 }

  datanode-1:                         # blocos de dados (réplica 1)
    <<: *hadoop
    hostname: datanode-1
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    networks:
      global-net: { ipv4_address: 172.28.0.52 }

  datanode-2:                         # blocos de dados (réplica 2)
    <<: *hadoop
    hostname: datanode-2
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    networks:
      global-net: { ipv4_address: 172.28.0.53 }

  # ----------------------------------------------------------- Aplicação
  auth:                               # nó emissor de tokens JWT
    build: ./services/auth
    hostname: auth
    restart: unless-stopped
    depends_on:
      certs: { condition: service_completed_successfully }
    volumes: [./certs:/certs:ro]
    networks:
      global-net: { ipv4_address: 172.28.0.11 }

  api-1:                              # réplica 1 do núcleo / coordenador 2PC
    <<: *api
    hostname: api-1
    environment:
      <<: *api-env
      NODE_ID: api-1
    networks:
      global-net: { ipv4_address: 172.28.0.21 }

  api-2:                              # réplica 2 do núcleo / coordenador 2PC
    <<: *api
    hostname: api-2
    environment:
      <<: *api-env
      NODE_ID: api-2
    networks:
      global-net: { ipv4_address: 172.28.0.22 }

  legacy:                             # "mainframe" do banco parceiro (Java + XML)
    build: ./services/legacy-java
    hostname: legacy
    restart: unless-stopped
    depends_on:
      certs: { condition: service_completed_successfully }
    environment:
      KEYSTORE: /certs/legacy.p12
      KEYSTORE_PASS: globalscale
      CHAVE_PUBLICA_NUCLEO: /certs/core-signing-public.pem
    volumes: [./certs:/certs:ro]
    networks:
      global-net: { ipv4_address: 172.28.0.31 }

  gateway:                            # ponto de entrada HTTPS + balanceamento
    image: nginx:1.27-alpine
    hostname: gateway
    restart: unless-stopped
    depends_on: [api-1, api-2, auth]
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    networks:
      global-net: { ipv4_address: 172.28.0.10 }

  # ------------------------------------------- Cliente de demonstração (opcional)
  cliente:
    build: ./services/core
    profiles: ["tools"]
    entrypoint: ["python", "/scripts/cliente.py"]
    environment:
      GSS_URL: https://gateway
      GSS_CA: /certs/ca.crt
      GSS_TOKEN_FILE: /token/jwt
    volumes:
      - ./scripts:/scripts:ro
      - ./certs:/certs:ro
      - cliente-token:/token
    networks: [global-net]

networks:
  global-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pg-europa:
  pg-america:
  coordenador-data:
  cliente-token:
