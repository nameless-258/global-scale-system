# =============================================================================
# Gateway / Balanceador de carga (ponto de entrada único, HTTPS)
#  - Termina o TLS do cliente e volta a cifrar (re-encrypt) até às réplicas:
#    o tráfego interno também é HTTPS, com verificação do certificado pela CA.
#  - Distribui pedidos por api-1 e api-2 (round-robin).
#  - Se uma réplica cair, é marcada como indisponível e o tráfego segue
#    para a outra (tolerância a falhas da camada aplicacional).
# =============================================================================
events { worker_connections 1024; }

http {
    log_format gss '$time_local $remote_addr "$request" $status '
                   '-> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout gss;
    error_log  /dev/stderr warn;
    server_tokens off;

    upstream api_cluster {
        server api-1:8443 max_fails=1 fail_timeout=10s;
        server api-2:8443 max_fails=1 fail_timeout=10s;
    }
    upstream auth_service {
        server auth:8443;
    }

    # Redireciona HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate     /certs/privado/tls.crt;
        ssl_certificate_key /certs/privado/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # TLS interno (gateway -> serviços) com verificação do certificado
        proxy_ssl_trusted_certificate /certs/publico/ca.crt;
        proxy_ssl_verify        on;
        proxy_ssl_verify_depth  2;
        proxy_ssl_server_name   on;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location /auth/ {
            proxy_ssl_name auth;
            proxy_pass https://auth_service;
        }
        location /.well-known/ {
            proxy_ssl_name auth;
            proxy_pass https://auth_service;
        }
        location / {
            proxy_ssl_name api;                 # SAN comum às duas réplicas
            proxy_pass https://api_cluster;
            # Só repete em OUTRA réplica pedidos que falharam a ligar; um POST que
            # já chegou a uma réplica NÃO é repetido (evita execução dupla).
            proxy_next_upstream error timeout;
            proxy_connect_timeout 3s;
            proxy_read_timeout    60s;
        }
    }
}
