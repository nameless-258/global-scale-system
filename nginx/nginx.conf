# =============================================================================
# Gateway / Balanceador de carga (ponto de entrada único, HTTPS)
#  - Termina o TLS do cliente e volta a cifrar (re-encrypt) até às réplicas:
#    o tráfego interno também é HTTPS, com verificação do certificado pela CA.
#  - Distribui pedidos por api-1 e api-2 (round-robin).
#  - Se uma réplica cair, é marcada como indisponível e o tráfego segue
#    para a outra (tolerância a falhas da camada aplicacional).
# =============================================================================
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;      # tipos corretos para .css, .js, .woff2
    default_type  application/octet-stream;
    log_format gss '$time_local $remote_addr "$request" $status '
                   '-> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout gss;
    error_log  /dev/stderr warn;
    server_tokens off;

    upstream api_cluster {
        server api-1:8443 max_fails=1 fail_timeout=10s;
        server api-2:8443 max_fails=1 fail_timeout=10s;
    }
    upstream auth_service {
        server auth:8443;
    }

    # Redireciona HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate     /certs/privado/tls.crt;
        ssl_certificate_key /certs/privado/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # TLS interno (gateway -> serviços) com verificação do certificado
        proxy_ssl_trusted_certificate /certs/publico/ca.crt;
        proxy_ssl_verify        on;
        proxy_ssl_verify_depth  2;
        proxy_ssl_server_name   on;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Interface web (ficheiros estáticos) com política de segurança de conteúdo
        location = /ui { return 301 /ui/; }
        location /ui/ {
            alias /usr/share/nginx/ui/;
            index index.html;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-cache" always;
        }

        # Controlo de falhas (só admin). O nome é resolvido a cada pedido pelo DNS
        # do Docker, para o gateway arrancar mesmo que o controlo não exista.
        location /controlo/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $controlo https://controlo:8443;
            proxy_ssl_name controlo;
            proxy_pass $controlo;
            proxy_read_timeout 60s;
        }

        # Envio DIRETO a uma réplica (sem balanceamento), para as demonstrações de
        # falha do coordenador: /no/api-1/transferencias -> api-1:/transferencias
        location ~ ^/no/(api-1|api-2)/(.*)$ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $replica $1;
            proxy_ssl_name $replica;
            proxy_pass https://$replica:8443/$2$is_args$args;
            proxy_read_timeout 60s;
        }

        location /auth/ {
            proxy_ssl_name auth;
            proxy_pass https://auth_service;
        }
        location /.well-known/ {
            proxy_ssl_name auth;
            proxy_pass https://auth_service;
        }
        location / {
            proxy_ssl_name api;                 # SAN comum às duas réplicas
            proxy_pass https://api_cluster;
            # Só repete em OUTRA réplica pedidos que falharam a ligar; um POST que
            # já chegou a uma réplica NÃO é repetido (evita execução dupla).
            proxy_next_upstream error timeout;
            proxy_connect_timeout 3s;
            proxy_read_timeout    60s;
        }
    }
}
